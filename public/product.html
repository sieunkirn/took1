<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title data-i18n="detail.pageTitle">took(툭) - 제품 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/took-mood.css"><!-- TOOK_prototype 무드 (2026-11-16) -->
<link rel="stylesheet" href="css/took-flat.css"><!-- 색 통일: 단색·핑크 #FF007B (2026-11-20, README '색') -->
<link rel="manifest" href="manifest.webmanifest">
<script src="js/touch-calib.js"></script>
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
</head>
<body class="tui-mood">
<main>
  <h1 data-i18n="detail.title">제품 상세 정보</h1>
  <div class="grid-2">
    <section class="area">
      <div class="label" data-i18n="detail.imageArea">제품 이미지 영역</div>
      <div class="placeholder" style="aspect-ratio:1/1" data-i18n="detail.imagePlaceholder">제품 이미지 플레이스홀더</div>
    </section>
    <section class="area">
      <div class="label" data-i18n="detail.infoArea">제품 정보 영역</div>
      <div id="product-info" class="muted" data-i18n="detail.loading">불러오는 중...</div>
    </section>
  </div>
  <section class="area">
    <div class="label" data-i18n="detail.actions">연결 기능</div>
    <div class="row">
      <button type="button" id="back" data-i18n="detail.back">이전 화면으로</button>
      <button type="button" id="to-similar" data-i18n="detail.toSimilar">비슷한 색상 제품 보기</button>
      <a href="index.html" data-i18n="detail.home">홈으로 돌아가기</a>
    </div>
  </section>
</main>
<script type="module">
  import { renderNav, api, qs, go, productDetailTable, el, shadePicker } from './js/common.js';
  import { t } from './js/i18n.js';
  renderNav();
  const id = qs('id');
  const from = qs('from');
  const info = document.getElementById('product-info');
  const buttons = ['to-similar'].map((x) => document.getElementById(x));
  const backTargets = { 'lip-together': 'lip-together.html', recommend: 'recommend.html' };
  document.getElementById('back').addEventListener('click', () => {
    if (backTargets[from]) location.href = backTargets[from];
    else if (history.length > 1) history.back();
    else location.href = 'index.html';
  });
  const { ok, body } = id ? await api('api/products/' + encodeURIComponent(id)) : { ok: false, body: { error: t('detail.noId') } };
  if (!ok) {
    // 서버 오류 문구는 한국어라 화면 언어 문구로 보여 준다 (ID 없음 / 못 찾음)
    info.replaceChildren(el('p', { class: 'msg', text: id ? t('detail.notFound') : t('detail.noId') }));
    buttons.forEach((b) => (b.disabled = true));
  } else {
    let p = body.product;
    // 호수 데이터가 있는 제품(또는 그 호수): 정보 표 아래에서 호수를 펼쳐 고른다 (따로 창으로 가지 않는다).
    // 고르면 정보 표와 '비슷한 색상' 버튼이 그 호수 기준으로 바뀐다
    const picker = p.shade_count > 1
      ? shadePicker(p, { onSelect: (s) => { p = s; info.replaceChildren(productDetailTable(p), picker); } })
      : null;
    if (picker) picker.classList.add('opt-detail');
    info.replaceChildren(productDetailTable(p), picker || '');
    buttons[0].addEventListener('click', () => {
      go('recommend.html', { hex: p.color_hex, exclude: p.id, source: 'product' });
    });
  }
</script>
</body>
</html>
