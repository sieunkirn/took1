<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>took(툭)</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="js/touch-calib.js"></script>
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
<style>
    /* 고정 비율 화면 (2026-11-13): 세로 900×1440(5:8) 비율만 유지한다.
     노트북·태블릿·휴대폰 어디서 열어도(device-frame.js 가 이 틀로 옮긴다) 가로 방향은 무시하고 세로 5:8 비율을 기준으로 화면을 가운데에 둔다.
     남는 공간은 검게 채워 앱처럼 보이게 한다. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
  /* 900×1440 앱 화면 바깥 여백: 앱 바탕(검정)과 구분되는 밝은 회색 (2026-11-16 요청). 앱 화면 자체는 검정 */
  html:has(body.tab-lock), body.tab-lock { background: #d4d4d4; }
  body.tab-lock { max-width: none; width: 100%; }
  #kiosk-frame { position: fixed; display: block; border: 0; transform-origin: 50% 50%; background: #000; }
  /* 홈 → 팔레트 깜빡임 막기 (2026-11-17): iframe 안에서 페이지를 옮기면 홈이 사라진 뒤 팔레트가 처음 그려지기 전까지
     iframe 이 비어(검정) 날아온 로고까지 한 번 꺼진다. 그동안 이 틀이 같은 로고를 같은 자리(팔레트 로고 x 354.33 y 66.31, 위 가운데)에 대신 그려 둔다 */
  #kiosk-hold { position: fixed; pointer-events: none; transform-origin: 50% 50%; z-index: 1; }
  #kiosk-hold[hidden] { display: none; }
  #kiosk-hold .hold-logo { position: absolute; left: 354.33px; top: 66.31px; width: 190px; height: 44.7px; color: #fff; }
  #kiosk-hold svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body data-idle-reset="off" class="tab-lock">
<iframe id="kiosk-frame" title="키오스크 화면" allow="camera; microphone; autoplay; fullscreen"></iframe>
<div id="kiosk-hold" aria-hidden="true" hidden></div>
<script>
  const frame = document.getElementById('kiosk-frame');
  const hold = document.getElementById('kiosk-hold');
  const BASE = [900, 1440]; // 기준 세로 화면: 5:8
  const fit = () => {
    const W = innerWidth, H = innerHeight;
    const scale = Math.min(W / BASE[0], H / BASE[1]);
    // 화면 속은 늘 900×1440 으로 그리고 통째로 줄이거나 키운다 (2026-11-15 QA: 기기마다 레이아웃 폭이 달라져
    // 작은 화면에서 메뉴가 두 줄이 되던 문제). 가운데를 축으로 scale 한다
    // 로고 붙잡기 층(kiosk-hold)도 iframe 과 똑같은 자리·크기·배율로 둔다
    for (const el of [frame, hold]) {
      el.style.width = BASE[0] + 'px';
      el.style.height = BASE[1] + 'px';
      el.style.left = (W - BASE[0]) / 2 + 'px';
      el.style.top = (H - BASE[1]) / 2 + 'px';
      el.style.transform = `scale(${scale})`;
    }
    document.body.classList.add('tab-lock');
  };
  // 홈 → 팔레트로 넘어가는 동안 로고 붙잡기: 홈(home.js)이 떠나기 직전에 켜고, 팔레트(palette.html)가 첫 화면에 로고를 그린 뒤 끈다.
  // 팔레트가 끄지 못해도(오류·다른 화면) 4초 뒤와 iframe 이 다 불러온 뒤에는 꺼진다
  import('./js/brand.js').then(({ logoFull }) => { hold.innerHTML = '<div class="hold-logo">' + logoFull() + '</div>'; }).catch(() => {});
  let holdTimer = 0;
  window.tookHold = (on) => {
    clearTimeout(holdTimer);
    hold.hidden = !on || !hold.firstChild;
    if (!hold.hidden) holdTimer = setTimeout(() => { hold.hidden = true; }, 4000);
  };
  frame.addEventListener('load', () => {
    if (hold.hidden) return;
    const w = frame.contentWindow;
    w.requestAnimationFrame(() => w.requestAnimationFrame(() => window.tookHold(false)));
  });
  // NFC 리더기(블루투스 키보드 모드) 입력 (2026-11-18): 키 입력은 포커스가 있는 문서로만 간다.
  // 이 틀(바깥 문서)에 포커스가 있으면 화면(iframe) 속 listenNfc 가 못 듣는다 → 화면이 바뀔 때마다 iframe 에 포커스를 주고,
  // 그래도 바깥으로 온 키는 그대로 iframe 창에 넘겨 준다 (같은 출처라 가능)
  frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch { /* 다른 출처 */ } });
  addEventListener('keydown', (e) => {
    try {
      const fwd = new KeyboardEvent('keydown', { key: e.key, code: e.code, shiftKey: e.shiftKey, bubbles: true, cancelable: true });
      fwd.tookAt = e.tookAt || performance.timeOrigin + e.timeStamp; // 원래 키가 들어온 시각 (nfc.js 가 글자 사이 간격을 잴 때 쓴다)
      frame.contentWindow.dispatchEvent(fwd);
      frame.contentWindow.focus();
    } catch { /* 화면이 아직 없음 */ }
  });
  addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  fit();
  // 새로고침(F5)하면 상태를 비우고 시작 화면부터 (preview.html 과 같은 규칙. 돌린 방향은 남긴다)
  const reloaded = performance.getEntriesByType?.('navigation')?.[0]?.type === 'reload';
  if (reloaded) {
    try { localStorage.removeItem('took.deviceMode'); } catch { /* 저장 불가 환경 */ }
    try { Object.keys(sessionStorage).filter((k) => k.startsWith('took.')).forEach((k) => sessionStorage.removeItem(k)); } catch { /* 없음 */ }
  }
  // 미리보기에서 왔으면 그 화면부터 (?page=palette.html). 이 사이트 안의 .html 만 연다
  const start = new URLSearchParams(location.search).get('page');
  const startOk = start && /^[\w-]+\.html(\?[^#]*)?$/.test(start) && !/^(kiosk|preview)\.html/.test(start);
  frame.src = reloaded || !startOk ? 'index.html' : start;
</script>
</body>
</html>
