<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>took(툭)</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="js/touch-calib.js"></script>
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
<style>
    /* 고정 비율 화면 (2026-11-13): Galaxy Tab S10 FE+ 세로 화면의 800×1280 비율만 유지한다.
     가로 방향은 무시하고 세로 5:8 비율을 기준으로 화면을 가운데에 둔다.
     남는 공간은 검게 채워 앱처럼 보이게 한다. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); }
  body.tab-lock { background: #000; }
  #kiosk-frame { position: fixed; display: block; border: 0; transform-origin: 50% 50%; }
</style>
</head>
<body data-idle-reset="off" class="tab-lock">
<iframe id="kiosk-frame" title="키오스크 화면" allow="camera; microphone; autoplay; fullscreen"></iframe>
<script>
  const frame = document.getElementById('kiosk-frame');
  const BASE = [800, 1280]; // Galaxy Tab S10 FE+ 세로 화면 비율: 5:8
  const fit = () => {
    const W = innerWidth, H = innerHeight;
    const scale = Math.min(W / BASE[0], H / BASE[1]);
    const fw = BASE[0] * scale;
    const fh = BASE[1] * scale;
    frame.style.width = fw + 'px';
    frame.style.height = fh + 'px';
    frame.style.left = (W - fw) / 2 + 'px';
    frame.style.top = (H - fh) / 2 + 'px';
    frame.style.transform = 'none';
    document.body.classList.add('tab-lock');
  };
  addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);
  fit();
  // 새로고침(F5)하면 상태를 비우고 시작 화면부터 (preview.html 과 같은 규칙. 돌린 방향은 남긴다)
  const reloaded = performance.getEntriesByType?.('navigation')?.[0]?.type === 'reload';
  if (reloaded) {
    try { localStorage.removeItem('took.deviceMode'); } catch { /* 저장 불가 환경 */ }
    try { Object.keys(sessionStorage).filter((k) => k.startsWith('took.')).forEach((k) => sessionStorage.removeItem(k)); } catch { /* 없음 */ }
  }
  // 미리보기에서 왔으면 그 화면부터 (?page=palette.html). 이 사이트 안의 .html 만 연다
  const start = new URLSearchParams(location.search).get('page');
  const startOk = start && /^[\w-]+\.html(\?[^#]*)?$/.test(start) && !/^(kiosk|preview)\.html/.test(start);
  frame.src = reloaded || !startOk ? 'index.html' : start;
</script>
</body>
</html>
