<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>took(툭) - 관리자</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="js/touch-calib.js"></script>
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
<script src="js/theme-boot.js"></script>
<style>
  /* 관리자 화면 (2026-11-15): 홈 오른쪽 아래 '관리자' 버튼으로 온다.
     - 터치 범위 조정: 정전식 터치 필름을 꽂은 뒤 십자 5개를 눌러 터치 좌표를 화면에 맞춘다 (js/touch-calib.js)
     - 호수 검수 (2026-11-18): 로컬 수집·검수 서버의 전체 검수 화면을 새 탭으로 연다
     - 조정값은 이 기기 브라우저에 저장되고, '조정값 복사'로 코드를 복사해 개발 쪽에 넘기면
       touch-calib.js 의 BUILT_IN_CODE 에 넣어 어느 기기·언제 켜도 같은 값이 적용된다
     calib.html 처럼 맨 위 창에서 바로 열리고, 키오스크와 같은 5:8 상자를 직접 그린다. 조정 전에는 터치가 어긋나 있으므로 화면 전체가 버튼 하나다 */
  html, body { height: 100%; margin: 0; overflow: hidden; background: #000; color: var(--ink); }
  /* 툭 서비스 화면(kiosk.html)과 같은 세로 900×1440(5:8) 상자를 창에 맞춰 키우거나 줄인다. 남는 곳은 검게 (2026-11-15) */
  /* 버튼 배치 (2026-11-18 사용자 지정): 터치 범위 조정 / 조정값 복사·조정값 초기화 / 스마트 미러 화면으로·호수 검수 */
  /* 웹캠 연결 설정 (2026-11-22): NFC 테스트·색 보정 줄 아래에 한 줄(.tool) 더 */
  /* 바코드 카메라 테스트 → NFC 테스트 (2026-11-18): 위 배치는 그대로 두고 맨 아래 정보 위에 한 줄(.tool)을 더한다 */
  .ad { position: fixed; left: 50%; top: 50%; width: 900px; height: 1440px; transform: translate(-50%, -50%) scale(var(--k, 1)); background: var(--paper); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr) auto auto auto; gap: 12px; padding: 12px; box-sizing: border-box; }
  .ad.empty { grid-template-rows: auto minmax(0, 1fr) minmax(0, 0.3fr) auto auto auto; }
  .ad .tool { grid-column: 1 / -1; min-height: 120px; font-size: 24px; }
  .ad .tool.half { grid-column: auto; } /* NFC 테스트·카메라 색 보정 한 줄에 둘 (2026-11-20) */
  .ad .wide { grid-column: 1 / -1; }
  .ad button.off { opacity: 0.45; }
  .ad h1 { grid-column: 1 / -1; margin: 4px 4px 0; font-size: 22px; }
  .ad button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 0; border-radius: 24px; font-size: 28px; font-weight: 800; word-break: keep-all; }
  .ad button small { font-size: 16px; font-weight: 500; color: var(--mute); }
  .ad .primary { grid-column: 1 / -1; background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .ad .primary small { color: inherit; opacity: 0.75; }
  .ad-code { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--mute); }
  .ad-code textarea { width: 100%; height: 76px; box-sizing: border-box; padding: 8px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--soft); color: var(--ink); font: 13px/1.4 ui-monospace, monospace; resize: none; }
</style>
</head>
<body data-idle-reset="off">
<div class="ad" id="ad"></div>
<script>
  const calib = window.__tookCalib || (() => { try { return window.top.__tookCalib; } catch { return null; } })();
  const box = document.getElementById('ad');
  const btn = (cls, title, sub, onclick) => {
    const b = document.createElement('button');
    b.type = 'button';
    if (cls) b.className = cls;
    b.innerHTML = `${title}<small>${sub}</small>`;
    b.addEventListener('click', onclick);
    return b;
  };
  // NFC 태그 확인 (2026-11-18): 리더기에 태그를 대면 읽은 번호와 표(nfc.js NFC_TAGS)에서 찾은 결과를 맨 아래 정보 줄에 보여 준다
  // 새 태그를 등록하거나 글자가 빠진 번호를 바로잡을 때 쓴다. 줄은 다시 그려도 그대로 쓰도록 한 번만 만든다
  const nfcLine = document.createElement('span');
  nfcLine.textContent = 'NFC 태그 확인: 리더기에 태그를 대 보세요';
  window.__nfcLine = nfcLine;
  const when = (iso) => (iso ? new Date(iso).toLocaleString('ko-KR') : '');
  // 호수 전체 검수 (2026-11-18): 로컬 수집·검수 서버(npm run shades:server, scripts/shades-server.js)의 /all 화면.
  // 그 서버가 켜진 컴퓨터에서만 열린다. 키오스크 화면은 두고 새 탭으로 연다 (검수가 끝나면 탭을 닫으면 된다)
  const SHADES_REVIEW = 'http://localhost:8766/all';
  const shadesBtn = (cls = '') => btn(cls, '호수 검수', '모든 제품·호수를 보고 넣기/빼기/색 고치기 · 이 컴퓨터에서 npm run shades:server 가 켜져 있어야 열려요 (새 탭)',
    () => { const w = window.open(SHADES_REVIEW, '_blank'); if (!w) location.href = SHADES_REVIEW; });
  // NFC 테스트 (2026-11-18 사용자 요청. 바코드 카메라 테스트 화면은 2026-11-20 바코드 기능과 함께 삭제)
  const nfcTestBtn = () => btn('tool half', 'NFC 테스트', '리더기에 카드를 대면 몇 번 카드인지, 읽은 번호와 찾은 제품을 크게 보여 줘요',
    () => { location.href = 'nfc-test.html'; });
  // 카메라 색 보정 (2026-11-20): 터치 범위 조정처럼 설치할 때 한 번. 흰 종이로 카메라 색 틀어짐을 재서 내 톤 추천에 쓴다 (color-calib.html)
  const colorCalibBtn = () => btn('tool half', '카메라 색 보정', '흰 종이를 대고 측정해 카메라 색 틀어짐을 맞춰요 · 내 톤 추천에 쓰여요',
    () => { location.href = 'color-calib.html'; });
  // 웹캠 연결 설정 (2026-11-22): 갤탭에서 USB 웹캠이 잘 안 잡혀서. 카메라 고르기·해상도·프레임·반전·회전·연결 진단 (camera-setup.html)
  const camSetupBtn = () => btn('tool', '웹캠 연결 설정', '카메라 고르기 · 해상도 낮추기 · 반전/회전 · 연결 상태와 진단 기록',
    () => { location.href = 'camera-setup.html'; });
  // 개발 쪽(Claude)에 그대로 붙여 넣을 글
  const copyText = () => {
    const code = calib.exportCode();
    if (!code) return null;
    const s = calib.status().saved;
    return `[툭 터치 조정값] 이 값을 웹에 고정 적용해 줘 (${when(s.at)}, 조정 오차 ${s.rms.toFixed(1)}px)\n${code}`;
  };
  async function copy(ta) {
    const text = ta.value;
    try {
      if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); calib.toast('조정값을 복사했어요. Claude 에게 붙여 넣어 주세요'); return; }
    } catch { /* 아래로 */ }
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    calib.toast(ok ? '조정값을 복사했어요. Claude 에게 붙여 넣어 주세요' : '아래 글을 길게 눌러 복사해 주세요');
  }
  const render = () => {
    const s = calib.status();
    box.replaceChildren();
    const h = document.createElement('h1');
    h.textContent = '관리자';
    box.append(h);
    box.classList.toggle('empty', !s.saved);
    if (!s.saved) {
      // 조정 전: 터치가 어긋나 있어도 눌리도록 화면 전체가 시작 버튼
      box.append(btn('primary', '화면 아무 곳이나 눌러<br>터치 범위 조정 시작', '정전식 필름을 꽂은 뒤 눌러 주세요. 십자 5개를 차례로 누르고 저장하면 정확도 테스트로 넘어가요', () => calib.startCalib()), shadesBtn('wide'), nfcTestBtn(), colorCalibBtn(), camSetupBtn());
    } else {
      // 조정값 초기화: 이 기기에 저장한 값을 지운다 (웹에 고정한 값이 있으면 그 값으로). 웹 고정값을 쓰는 중이면 지울 값이 없다
      const local = s.saved.source !== 'builtin';
      const resetBtn = btn(local ? '' : 'off', '조정값 초기화',
        local ? (s.builtIn ? '이 기기 조정값을 지우고 웹에 고정한 값으로 돌아가요' : '조정 전 상태로 돌아가요') : '지울 조정값이 없어요 (웹에 고정한 값 사용 중)',
        () => (local ? calib.reset() : calib.toast('지금은 웹에 고정한 값을 쓰고 있어서 지울 조정값이 없어요')));
      box.append(
        btn('primary', '터치 범위 조정', '정전식 필름을 꽂은 뒤 십자 5개를 다시 눌러 맞춰요. 저장하면 정확도 테스트로 넘어가요', () => calib.startCalib()),
        btn('', '조정값 복사', 'Claude 에게 붙여 넣으면 웹에 고정돼요', () => copy(box.querySelector('textarea'))),
        resetBtn,
        btn('', '스마트 미러 화면으로', '조정한 채로 실제 화면을 써 봐요', () => { location.href = 'index.html'; }),
        shadesBtn(),
        nfcTestBtn(),
        colorCalibBtn(),
        camSetupBtn(),
      );
    }
    const info = document.createElement('div');
    info.className = 'ad-code';
    const src = !s.saved ? '조정값 없음'
      : s.saved.source === 'builtin' ? '웹에 고정한 값 사용 중'
      : s.sameAsBuiltIn ? '이 기기에 저장한 값 사용 중 (웹에 고정한 값과 같음)'
      : '이 기기에 저장한 값 사용 중' + (s.builtIn ? ' (웹에 고정한 값과 다름 → 복사해서 다시 고정하세요)' : ' (아직 웹에 고정 안 됨 → 복사해서 Claude 에게 붙여 넣으세요)');
    const t = s.lastTest;
    const line = document.createElement('span');
    line.textContent = src
      + (s.saved ? ` · ${when(s.saved.at)} · 조정 오차 ${s.saved.rms.toFixed(1)}px` : '')
      + (t ? ` · 마지막 테스트 ${t.n}/${t.total} 맞음 (평균 ${t.avg.toFixed(0)}px)` : '')
      + (s.sim ? ' · 시뮬레이션' : '');
    info.append(line, nfcLine);
    if (s.saved) {
      const ta = document.createElement('textarea');
      ta.readOnly = true;
      ta.value = copyText() || '';
      ta.setAttribute('aria-label', '복사할 조정값');
      info.append(ta);
    }
    box.append(info);
  };
  if (calib) { calib.onChange(render); render(); }
  else box.textContent = '터치 조정 스크립트를 불러오지 못했어요';
  // 5:8 상자 크기 맞추기 (kiosk.html 과 같은 계산)
  const fitBox = () => document.documentElement.style.setProperty('--k', Math.min(innerWidth / 900, innerHeight / 1440));
  addEventListener('resize', fitBox);
  document.addEventListener('fullscreenchange', fitBox);
  fitBox();
  // 조정 전에는 터치가 어긋나 상자 밖 검은 여백이 눌릴 수도 있다 → 여백을 눌러도 조정 시작
  document.addEventListener('click', (e) => { if (calib && !calib.status().saved && !box.contains(e.target)) calib.startCalib(); });
</script>
<script type="module">
  import { listenNfc, matchTag, resolveTag, normalizeTag, NFC_LABELS } from './js/nfc.js';
  listenNfc((code) => {
    const line = window.__nfcLine;
    if (!line) return;
    const n = normalizeTag(code);
    const key = matchTag(n);
    const id = resolveTag(n);
    const time = new Date().toLocaleTimeString('ko-KR');
    line.textContent = `NFC 태그 확인 (${time}): 읽은 번호 ${n} (${n.length}글자)`
      + (key ? ` → ${NFC_LABELS[key] || key}` + (key === n ? '' : ' (글자 빠짐 감안)') + ` · ${id}`
        : id ? ` → 제품 ID · ${id}` : ' → 표에 없음 (바코드 번호면 팔레트에서 찾아요)');
  });
</script>
</body>
</html>
