<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>took(툭) - 거울 화면 미리보기</title>
<link rel="stylesheet" href="css/wireframe.css">
<style>
  /* 직원용: 노트북·PC 에서 키오스크 화면을 그대로 띄워 본다 (common.js openInTabFrame 이 자동으로 이리 보낸다).
     키오스크 = 스탠드형 동그란 거울 안에 갤럭시탭 S10 FE+ 를 세로로 넣은 것 (2026-11-11 가로 → 다시 세로).
     탭 화면(기본 800×1280, 추정값)을 돌리지 않고 창에 맞춰 키우거나 줄인다. 보기 방식:
     ① 거울 틀: 탭을 감싼 동그란 거울 테두리까지 (거울 지름 = 탭 대각선 + 여백)
     ② 탭만: 검은 베젤만 둘러 화면을 가장 크게 */
  html, body { height: 100%; overflow: hidden; background: #e4e4e4; }
  .pv-stage { position: fixed; inset: 0; display: grid; place-items: center; }
  .pv-mirror { position: relative; display: grid; place-items: center; border-radius: 50%; }
  .mirror-on .pv-mirror { background: radial-gradient(circle at 35% 30%, #fafafa, #d6d6d6 70%, #c4c4c4); box-shadow: 0 0 0 calc(var(--rim, 14px)) #2b2b2b, 0 0 0 calc(var(--rim, 14px) + 2px) #555, 0 24px 70px rgba(0, 0, 0, 0.3); }
  .pv-clip { position: relative; overflow: hidden; background: var(--paper); border: var(--bezel, 10px) solid #111; border-radius: calc(var(--bezel, 10px) + 10px); box-shadow: 0 0 0 1px #2a2a2a, 0 14px 40px rgba(0, 0, 0, 0.25); box-sizing: content-box; }
  .pv-clip iframe { display: block; border: 0; transform-origin: 0 0; }
  /* 거울 받침(스탠드): 거울 아래 기둥과 발 */
  .pv-standleg { display: none; position: absolute; left: 50%; top: 100%; width: 22px; translate: -50% 0; background: linear-gradient(90deg, #3a3a3a, #222); border-radius: 0 0 4px 4px; }
  .mirror-on .pv-standleg { display: block; }
  /* 설정: 왼쪽 위 작은 버튼 */
  .pv-bar { position: fixed; top: 12px; left: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 18px; background: rgba(255, 255, 255, 0.95); box-shadow: var(--shadow-up); width: 236px; }
  .pv-bar.folded { width: auto; }
  .pv-bar.folded > :not(#pv-fold) { display: none; }
  #pv-fold { min-height: 40px; padding: 4px 14px; background: var(--soft); font-size: 14px; }
  .pv-mode { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 12px 14px; text-align: left; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--paper); }
  .pv-mode b { font-size: 15px; }
  .pv-mode span { font-size: 12px; font-weight: 500; color: var(--mute); }
  .pv-mode[aria-pressed="true"], .pv-mode[aria-pressed="true"]:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .pv-mode[aria-pressed="true"] span { color: rgba(255, 255, 255, 0.7); }
  .pv-bar label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--mute); }
  .pv-bar select { font-size: 14px; }
  /* 거울 필름 테스트 (2026-11-11): 거울 유리에 브라운·실버 필름을 붙였을 때 화면이 어떻게 보일지 겹쳐 본다 (근사값, 실제 필름 투과율과 다를 수 있음).
     필름 색은 시뮬레이션이라 실제 색으로 칠한다. 화면을 누르는 데 방해되지 않게 pointer-events 없음 */
  .pv-film { position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: calc(var(--bezel, 10px) + 10px); display: none; }
  .mirror-on .pv-film { border-radius: 50%; }
  .pv-film::after { content: ''; position: absolute; inset: 0; border-radius: inherit; mix-blend-mode: screen; }
  body[data-film="brown"] .pv-film, body[data-film="silver"] .pv-film { display: block; }
  body[data-film="brown"] .pv-film { background: rgba(96, 60, 32, 0.6); mix-blend-mode: multiply; }
  body[data-film="brown"] .pv-film::after { background: linear-gradient(125deg, rgba(255, 226, 196, 0.22) 0%, rgba(255, 226, 196, 0) 38%, rgba(255, 226, 196, 0.1) 58%, rgba(255, 226, 196, 0) 72%); }
  body[data-film="silver"] .pv-film { background: rgba(118, 122, 128, 0.62); mix-blend-mode: multiply; }
  body[data-film="silver"] .pv-film::after { background: linear-gradient(125deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.04) 36%, rgba(255, 255, 255, 0.22) 55%, rgba(255, 255, 255, 0.02) 74%, rgba(255, 255, 255, 0.16) 100%); }
  /* 필름 버튼: 거울 오른쪽 옆 */
  .pv-films { position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 18px; background: rgba(255, 255, 255, 0.95); box-shadow: var(--shadow-up); width: 132px; }
  .pv-films p { margin: 0 0 2px; font-size: 12px; font-weight: 700; color: var(--mute); }
  .pv-films button { min-height: 44px; padding: 6px 12px; font-size: 14px; box-shadow: inset 0 0 0 1px var(--line-2); background: var(--paper); }
  .pv-films button[aria-pressed="true"], .pv-films button[aria-pressed="true"]:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .pv-films small { font-size: 11px; color: var(--mute); line-height: 1.35; }
  .pv-films p:not(:first-child) { margin-top: 8px; }
  .pv-films .pv-rotate { font-weight: 700; }
</style>
</head>
<body data-idle-reset="off">
<div class="pv-stage" id="pv-stage">
  <div class="pv-mirror" id="pv-mirror">
    <div class="pv-clip" id="pv-clip"><iframe id="pv-frame" title="키오스크 화면" allow="camera; microphone; autoplay; fullscreen"></iframe></div>
    <div class="pv-film" id="pv-film" aria-hidden="true"></div>
    <div class="pv-standleg" id="pv-leg" aria-hidden="true"></div>
  </div>
</div>
<div class="pv-films" id="pv-films" role="group" aria-label="거울 필름 테스트">
  <p>필름 테스트</p>
  <button type="button" data-film="none" aria-pressed="true">필름 없음</button>
  <button type="button" data-film="brown" aria-pressed="false">브라운 필름</button>
  <button type="button" data-film="silver" aria-pressed="false">실버 필름</button>
  <small>근사 시뮬레이션이에요. 실제 필름과 다를 수 있어요</small>
  <p>화면 방향</p>
  <button type="button" id="pv-rotate" class="pv-rotate" aria-label="화면 방향 바꾸기">세로 ↔ 가로</button>
</div>
<div class="pv-bar folded" id="pv-bar">
  <button type="button" id="pv-fold" aria-expanded="false">설정</button>
  <button type="button" class="pv-mode" data-mode="mirror" aria-pressed="false"><b>거울 틀</b><span>동그란 거울 안에 세로로 넣은 모습</span></button>
  <button type="button" class="pv-mode" data-mode="tab" aria-pressed="false"><b>탭만</b><span>갤럭시탭 세로 화면을 창에 가장 크게</span></button>
  <label>화면
    <select id="pv-page">
      <option value="index.html">홈(대기 화면)</option>
      <option value="palette.html">팔레트</option>
      <option value="chat.html">AI 뷰티 챗봇</option>
    </select>
  </label>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const frame = $('pv-frame');
  // 갤럭시탭 S10 FE+ 실제 화면 1800×2880(세로). 기본 배율(2.25)이면 CSS 800×1280 으로 추정 (삼성이 공개하지 않아 추정값).
  // 전체 화면(키오스크)으로 띄운다고 보고 주소창 높이는 빼지 않는다
  // 기본은 세로(800×1280). 필름 테스트 박스의 '세로 ↔ 가로' 버튼으로 탭을 돌려 볼 수 있다 (기억해 둔다)
  const PORTRAIT = [800, 1280];
  let DEVICE = (() => { try { return localStorage.getItem('took.previewOrient') === 'landscape' ? [1280, 800] : PORTRAIT; } catch { return PORTRAIT; } })();
  const reloaded = performance.getEntriesByType?.('navigation')?.[0]?.type === 'reload';
  const params = new URLSearchParams(location.search);
  const saved = (() => { try { return localStorage.getItem('took.mirrorPreview'); } catch { return null; } })();
  let mode = saved === 'tab' ? 'tab' : 'mirror';

  const fit = () => {
    const W = innerWidth, H = innerHeight;
    const [w, h] = DEVICE;
    const mirror = mode === 'mirror';
    document.body.classList.toggle('mirror-on', mirror);
    const BEZ = 20; // 베젤 10px × 2
    let s;
    if (mirror) {
      // 거울 지름 = 탭(베젤 포함) 대각선 + 여백 4%. 테두리(14px)·받침까지 창에 들어가게
      const dScreen = Math.hypot(w, h);
      s = Math.min((W - 60) / (dScreen * 1.06), (H - 90) / (dScreen * 1.06));
      const D = Math.hypot(w * s + BEZ, h * s + BEZ) * 1.04;
      $('pv-mirror').style.width = $('pv-mirror').style.height = D + 'px';
      $('pv-leg').style.height = Math.max(0, (H - D) / 2 - 4) + 'px';
      $('pv-stage').style.placeItems = 'start center';
      $('pv-mirror').style.marginTop = Math.max(20, (H - D) / 2 - 30) + 'px';
    } else {
      s = Math.min((W - BEZ - 40) / w, (H - BEZ - 40) / h);
      $('pv-mirror').style.width = $('pv-mirror').style.height = 'auto';
      $('pv-stage').style.placeItems = 'center';
      $('pv-mirror').style.marginTop = '0';
    }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    frame.style.transform = `scale(${s})`;
    $('pv-clip').style.width = w * s + 'px';
    $('pv-clip').style.height = h * s + 'px';
    // 필름 버튼은 거울(탭) 오른쪽 옆에, 창 밖으로 나가면 오른쪽 끝에 붙인다
    requestAnimationFrame(() => {
      const box = $('pv-mirror').getBoundingClientRect();
      const fb = $('pv-films');
      const left = Math.min(box.right + 24, innerWidth - fb.offsetWidth - 12);
      fb.style.left = Math.max(12, left) + 'px';
      fb.style.top = Math.max(12, box.top + box.height / 2 - fb.offsetHeight / 2) + 'px';
    });
  };
  // 거울 필름 테스트: 없음 / 브라운 / 실버 (기억해 둔다)
  const setFilm = (f) => {
    document.body.dataset.film = f;
    try { localStorage.setItem('took.mirrorFilm', f); } catch { /* 저장 불가 환경 */ }
    document.querySelectorAll('#pv-films button[data-film]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.film === f)));
  };
  document.querySelectorAll('#pv-films button[data-film]').forEach((b) => b.addEventListener('click', () => setFilm(b.dataset.film)));
  // 화면 방향: 세로 ↔ 가로 (탭을 돌린 크기로 다시 맞춘다. 화면 내용은 그 방향의 레이아웃으로 다시 그려진다)
  const showOrient = () => {
    const land = DEVICE[0] > DEVICE[1];
    $('pv-rotate').textContent = land ? '가로 → 세로로' : '세로 → 가로로';
  };
  $('pv-rotate').addEventListener('click', () => {
    DEVICE = [DEVICE[1], DEVICE[0]];
    try { localStorage.setItem('took.previewOrient', DEVICE[0] > DEVICE[1] ? 'landscape' : 'portrait'); } catch { /* 저장 불가 환경 */ }
    showOrient();
    fit();
  });
  showOrient();
  setFilm((() => { try { const v = localStorage.getItem('took.mirrorFilm'); return ['brown', 'silver'].includes(v) ? v : 'none'; } catch { return 'none'; } })());
  const setMode = (m) => {
    mode = m;
    try { localStorage.setItem('took.mirrorPreview', m); } catch { /* 저장 불가 환경 */ }
    document.querySelectorAll('.pv-mode').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    fit();
  };
  document.querySelectorAll('.pv-mode').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('pv-fold').addEventListener('click', () => {
    const folded = $('pv-bar').classList.toggle('folded');
    $('pv-fold').textContent = folded ? '설정' : '설정 닫기';
    $('pv-fold').setAttribute('aria-expanded', String(!folded));
  });
  $('pv-page').addEventListener('change', () => { frame.src = $('pv-page').value; });
  document.addEventListener('fullscreenchange', fit);
  addEventListener('resize', fit);
  // 자동으로 왔으면 그 화면부터 (?page=palette.html). 이 사이트 안의 .html 이면 목록에 없어도 연다
  const start = params.get('page');
  const startOk = start && /^[\w-]+\.html(\?[^#]*)?$/.test(start);
  frame.addEventListener('load', () => {
    try {
      const now = frame.contentWindow.location.pathname.split('/').pop() || 'index.html';
      if ([...$('pv-page').options].some((o) => o.value === now)) $('pv-page').value = now;
    } catch { /* 다른 주소 */ }
  });
  setMode(mode);
  // 미리보기를 새로고침하면(F5) 상태를 비우고 시작 화면부터
  if (reloaded) {
    try { localStorage.removeItem('took.deviceMode'); } catch { /* 저장 불가 환경 */ }
    try { Object.keys(sessionStorage).filter((k) => k.startsWith('took.')).forEach((k) => sessionStorage.removeItem(k)); } catch { /* 없음 */ }
  }
  frame.src = reloaded ? 'index.html' : startOk ? start : 'index.html';
</script>
</body>
</html>
