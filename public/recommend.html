<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title data-i18n="rec.pageTitle">took(툭) - 제품 추천</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="css/took-mood.css"><!-- TOOK_prototype 무드 (2026-11-16) -->
<link rel="stylesheet" href="css/took-flat.css"><!-- 색 통일: 단색·핑크 #FF007B (2026-11-20, README '색') -->
<link rel="manifest" href="manifest.webmanifest">
<script src="js/touch-calib.js"></script>
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
</head>
<body class="tui-mood">
<main>
  <h1 data-i18n="rec.title">색상 기반 제품 추천</h1>
  <section class="area">
    <div class="label" data-i18n="rec.refArea">기준 색상 정보</div>
    <p id="ref-color">기준 색상: -</p>
    <p class="muted" data-i18n="rec.method">추천 방식: 기준 색상과 각 제품 색상의 CIEDE2000 색차(ΔE)를 계산해 작은 순서로 정렬합니다. 유사도 = 100 − 2 × ΔE (최소 0%).</p>
    <div class="row">
      <label for="finish-filter" data-i18n="rec.finishFilter">제형 필터</label>
      <select id="finish-filter"><option value="" data-i18n="rec.all">전체</option></select>
      <label for="limit" data-i18n="rec.count">개수</label>
      <select id="limit"><option>5</option><option selected>10</option><option>20</option></select>
    </div>
  </section>
  <section class="area">
    <div class="label" data-i18n="rec.listArea">추천 결과 목록</div>
    <div id="rec-status" class="muted"></div>
    <div id="rec-list" class="cards"></div>
  </section>
  <section class="area">
    <div class="row">
      <button type="button" id="recolor" data-i18n="rec.recolor">다시 조색하기</button>
      <a href="index.html" data-i18n="detail.home">홈으로 돌아가기</a>
    </div>
  </section>
</main>
<script type="module">
  import { renderNav, api, qs, store, el, productCard, FINISH_LABELS } from './js/common.js';
  import { t } from './js/i18n.js';
  import { normalizeHex } from './lib/color.js';
  renderNav();

  // 색상값 출처: 이동 시 전달값 > 마지막으로 본 추천 > 립 컬러 매핑 세션
  const saved = store.get('recommendQuery') || {};
  const passed = normalizeHex(qs('hex') || '');
  const hex = passed || saved.hex || store.get('lipColor')?.hex || null;
  const exclude = passed ? (qs('exclude') || '') : (saved.exclude || '');
  const source = passed ? (qs('source') || 'lip') : (saved.source || 'lip');
  const sourceLabel = ['lip', 'barcode', 'product'].includes(source) ? t('rec.src.' + source) : source;
  const finishSel = document.getElementById('finish-filter');
  const limitSel = document.getElementById('limit');
  for (const [k, v] of Object.entries(FINISH_LABELS)) finishSel.append(el('option', { value: k, text: t('finish.' + k) === 'finish.' + k ? v : t('finish.' + k) }));
  finishSel.value = saved.hex === hex ? (saved.finish || '') : '';

  async function load() {
    const status = document.getElementById('rec-status');
    const list = document.getElementById('rec-list');
    if (!hex) {
      status.replaceChildren(el('p', { class: 'msg', text: t('rec.noHex') }));
      list.replaceChildren();
      return;
    }
    store.set('recommendQuery', { hex, exclude, source, finish: finishSel.value });
    const p = new URLSearchParams({ hex, limit: limitSel.value });
    if (finishSel.value) p.set('finish', finishSel.value);
    if (exclude) p.set('exclude', exclude);
    const { ok, body } = await api('api/recommend?' + p);
    if (!ok) { status.textContent = body.error; return; }
    status.textContent = t('rec.result', { n: body.products.length });
    list.replaceChildren(...body.products.map((prod) => productCard(prod, { from: 'recommend' })));
  }
  document.getElementById('ref-color').textContent = hex ? t('rec.ref', { hex, src: sourceLabel }) : t('rec.refNone');
  finishSel.addEventListener('change', load);
  limitSel.addEventListener('change', load);
  document.getElementById('recolor').addEventListener('click', () => { location.href = 'lip-together.html'; });
  load();
</script>
</body>
</html>
