<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>took(툭) - 세로 화면 미리보기</title>
<link rel="stylesheet" href="css/wireframe.css">
<style>
  /* 직원용: PC·노트북에서 iPad 세로 화면을 띄워 본다. 보기 방식은 두 가지:
     ① 돌려서 꽉 차게: 웹을 90° 돌려 노트북 가로 = 웹 세로, 노트북 세로 = 웹 가로 (노트북 화면 크기 그대로)
     ② 똑바로 보기: 고른 기기의 세로 화면(기본 갤럭시탭 S10 FE+ 800×1280)을 돌리지 않고 창 높이에 맞춰 키우거나 줄인다
     어느 쪽이든 세로 레이아웃(세로 방향 + 너비 700px 이상)으로 그려지고, 실제 iPad 는 세우기만 하면 같은 화면이 된다 */
  html, body { height: 100%; overflow: hidden; background: #e4e4e4; }
  .pv-stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: var(--pv-gap, 48px); }
  .pv-clip { position: relative; box-sizing: content-box; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 10px 40px rgba(0, 0, 0, 0.12); }
  /* 똑바로 보기: 기기 테두리(검은 베젤)를 둘러 갤럭시탭·스마트폰처럼 보이게. 돌려서 꽉 차게는 테두리 없이 */
  .pv-dev { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .upright .pv-dev > .pv-clip { border: var(--bezel, 12px) solid #111; border-radius: calc(var(--bezel, 12px) + 14px); box-shadow: 0 0 0 1px #2a2a2a, 0 18px 50px rgba(0, 0, 0, 0.28); }
  .upright .pv-phone > .pv-clip { --bezel: 10px; border-radius: 40px; }
  .pv-cap { font-size: 13px; font-weight: 600; color: #6b6b6b; }
  /* 프레임 위 '이 기기를 ○○으로': 실제 태블릿·휴대폰에서 누르면 그 기기는 그 모드로만 열린다 (common.js DEVICE_MODE) */
  .pv-pick { display: none; min-height: 40px; padding: 6px 16px; border: 1px solid #191919; border-radius: 999px; background: #fff; color: #191919; font-size: 14px; font-weight: 700; }
  .pv-pick:hover:not(:disabled) { background: #191919; color: #fff; }
  .upright .pv-pick { display: inline-flex; align-items: center; gap: 6px; }
  .pv-solo .pv-pick, .pv-solo .pv-check { display: none !important; }
  /* 기기 선택 해제: 태블릿으로 고정한 기기(pv-solo)에서만 설정 창에 보인다 */
  .pv-reset-device { display: none; min-height: 40px; padding: 8px 12px; border: 1px solid var(--ink); background: var(--paper); font-size: 14px; }
  .pv-solo .pv-bar:not(.folded) .pv-reset-device { display: block; }
  /* 태블릿 고정이면 설정 버튼에 바로 해제가 있다는 걸 보이게 */
  .pv-solo #pv-fold::after { content: ' · 기기 해제'; color: var(--mute); font-weight: 500; }
  /* 스마트폰: QR 을 '찍기' 전에는 안내만. 아래 버튼으로 태블릿의 QR 을 찍은 것처럼 휴대폰 챗봇을 연다 */
  .pv-phone { display: none; }
  .upright.with-phone .pv-phone { display: flex; }
  .pv-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; background: #f4f4f4; color: #4e4e4e; font-size: 14px; word-break: keep-all; }
  .pv-empty svg { width: 44px; height: 44px; color: #8b8b8b; }
  .pv-empty[hidden] { display: none; }
  .pv-phone-bar { display: flex; gap: 8px; }
  .pv-phone-bar button { min-height: 40px; padding: 6px 14px; border-radius: 999px; font-size: 14px; }
  #pv-scan:not(:disabled) { background: #191919; border-color: #191919; color: #fff; }
  #pv-scan.ready { animation: pv-ready 1.4s ease-in-out infinite; }
  @keyframes pv-ready { 50% { box-shadow: 0 0 0 6px rgba(0, 0, 0, 0.12); } }
  .pv-clip iframe { display: block; border: 0; transform-origin: 0 0; }
  /* 설정: 왼쪽 위 작은 버튼. 누르면 보기 방식 두 개가 펼쳐진다 */
  .pv-bar { position: fixed; top: 12px; left: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 18px; background: rgba(255, 255, 255, 0.95); box-shadow: var(--shadow-up); width: 236px; }
  .pv-bar.folded { width: auto; }
  .pv-bar.folded > :not(#pv-fold) { display: none; }
  .pv-bar button { border-radius: var(--r-s); }
  #pv-fold { min-height: 40px; padding: 4px 14px; border: 0; background: var(--soft); font-size: 14px; }
  #pv-fold:hover { background: var(--soft-2); color: var(--ink); }
  .pv-mode { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 12px 14px; text-align: left; border: 1px solid var(--line-2); background: var(--paper); }
  .pv-mode b { font-size: 15px; }
  .pv-mode span { font-size: 12px; font-weight: 500; color: var(--mute); }
  .pv-mode[aria-pressed="true"], .pv-mode[aria-pressed="true"]:hover:not(:disabled) { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .pv-mode[aria-pressed="true"] span { color: rgba(255, 255, 255, 0.7); }
  .pv-mode:hover:not([aria-pressed="true"]) { background: var(--soft); color: var(--ink); }
  .pv-bar label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--mute); }
  .pv-bar select { border-radius: var(--r-s); font-size: 14px; }
  .pv-bar .pv-check { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
</style>
</head>
<body data-idle-reset="off">
<div class="pv-stage" id="pv-stage">
  <div class="pv-dev pv-tab">
    <button type="button" class="pv-pick" id="pv-pick-tablet" title="이 기기를 매장 태블릿(키오스크)으로 씁니다. 미리보기 틀 없이 이 화면만 보여요">이 기기를 태블릿으로</button>
    <div class="pv-clip" id="pv-clip"><iframe id="pv-frame" title="세로 화면" allow="camera; microphone; autoplay; fullscreen"></iframe></div>
  </div>
  <!-- 스마트폰: 손님 휴대폰 화면. iframe 이름 took-phone → 안의 화면이 손님 휴대폰 모드가 된다 (common.js PHONE) -->
  <div class="pv-dev pv-phone" id="pv-phone">
    <button type="button" class="pv-pick" id="pv-pick-phone" title="이 기기를 손님 휴대폰으로 씁니다. 챗봇 화면만 보여요">이 기기를 휴대폰으로</button>
    <div class="pv-clip" id="pv-pclip">
      <iframe id="pv-pframe" name="took-phone" title="스마트폰 화면" allow="microphone; autoplay"></iframe>
      <div class="pv-empty" id="pv-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 16h3"/></svg>
        <strong>손님 휴대폰</strong>
        <span>태블릿 팔레트에서 '휴대폰으로 가져가기'를 누른 뒤<br>아래 'QR 찍기'를 누르면 여기서 챗봇이 열려요</span>
      </div>
    </div>
    <div class="pv-phone-bar">
      <button type="button" id="pv-scan" disabled>QR 찍기</button>
      <button type="button" id="pv-preset">처음으로</button>
    </div>
  </div>
</div>
<div class="pv-bar folded" id="pv-bar">
  <button type="button" id="pv-fold" aria-expanded="false">설정</button>
  <button type="button" class="pv-mode" data-mode="rotate" aria-pressed="false"><b>돌려서 꽉 차게</b><span>노트북 가로 = 웹 세로 · 노트북 화면 크기 그대로</span></button>
  <button type="button" class="pv-mode" data-mode="upright" aria-pressed="false"><b>똑바로 보기</b><span>돌리지 않고 갤럭시탭 세로 화면을 창 높이에 맞춤</span></button>
  <label class="pv-check"><input type="checkbox" id="pv-show-phone"> 스마트폰 같이 보기</label>
  <button type="button" id="pv-device-reset" class="pv-reset-device">기기 선택 해제 (처음 상태로)</button>
  <label>화면
    <select id="pv-page">
      <option value="index.html">홈</option>
      <option value="palette.html">팔레트</option>
    </select>
  </label>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const frame = $('pv-frame');
  // 똑바로 보기 기기 크기(CSS 픽셀). 갤럭시탭 S10 FE+ 는 실제 화면 1800×2880, 기본 배율(2.25)이면 800×1280 으로 추정
  // (삼성이 공개하지 않아 추정값)
  const DEVICE = [800, 1280];
  // 새로고침(F5·새로고침 버튼)하면 기기 설정(태블릿·휴대폰 고정)부터 푼다 → 태블릿+스마트폰 첫 화면
  const reloaded = performance.getEntriesByType?.('navigation')?.[0]?.type === 'reload';
  if (reloaded) { try { localStorage.removeItem('took.deviceMode'); } catch { /* 저장 불가 환경 */ } }
  const PHONE_DEVICE = [390, 844]; // 손님 스마트폰 (흔한 크기, CSS 픽셀)
  // 태블릿 모드로 고른 기기(took.deviceMode=tablet)를 가로로 열면: 세로 태블릿 틀 하나만 (스마트폰·기기 선택 버튼 없이). 모든 화면은 세로 전용
  const SOLO = (() => { try { return localStorage.getItem('took.deviceMode') === 'tablet'; } catch { return false; } })();
  if (SOLO) document.documentElement.classList.add('pv-solo');
  const pframe = $('pv-pframe');
  let showPhone = !SOLO && (() => { try { return localStorage.getItem('took.previewPhone') !== 'off'; } catch { return true; } })();
  const saved = (() => { try { return localStorage.getItem('took.portraitPreview'); } catch { return null; } })();
  const params = new URLSearchParams(location.search);
  // 가로 화면에서 자동으로 왔으면(auto=1) 탭 크기 그대로 보기. 다시 가로로 돌아가는 설정은 여기서 지운다
  try { sessionStorage.removeItem('took.landscape'); } catch { /* 없음 */ }
  let mode = params.get('auto') === '1' || saved !== 'rotate' ? 'upright' : 'rotate';

  // 그릴 크기(w×h)를 정하고, 돌리기면 시계 방향 90°(웹 위쪽 = 노트북 오른쪽)로 돌려 창에 맞춘다. 돌려도 클릭·드래그는 그대로 된다
  const fit = () => {
    const W = innerWidth, H = innerHeight;
    const rot = mode === 'rotate';
    const both = !rot && showPhone; // 똑바로 보기 + 스마트폰 같이 보기: [태블릿][스마트폰] 을 같은 배율로 나란히
    const stage = $('pv-stage');
    stage.classList.toggle('upright', !rot);
    stage.classList.toggle('with-phone', both);
    const [w, h] = rot ? [H, W] : DEVICE;
    const vw = rot ? h : w, vh = rot ? w : h; // 화면에 보이는 크기
    // 똑바로 보기는 기기 테두리(태블릿 12px, 폰 10px)와 둘 사이 간격·폰 아래 버튼 자리를 빼고 맞춘다
    const GAP = 48, BEZ = 24, PBEZ = 20, BAR = 56, TOP = 54, PAD = 28;
    const s = rot ? Math.min(W / vw, H / vh)
      : both ? Math.min((W - GAP - BEZ - PBEZ - PAD * 2) / (vw + PHONE_DEVICE[0]), (H - BEZ - TOP - PAD) / vh, (H - PBEZ - BAR - TOP - PAD) / PHONE_DEVICE[1])
      : Math.min((W - BEZ - PAD) / vw, (H - BEZ - TOP - PAD) / vh);
    if (both) {
      pframe.style.width = PHONE_DEVICE[0] + 'px';
      pframe.style.height = PHONE_DEVICE[1] + 'px';
      pframe.style.transform = `scale(${s})`;
      $('pv-pclip').style.width = PHONE_DEVICE[0] * s + 'px';
      $('pv-pclip').style.height = PHONE_DEVICE[1] * s + 'px';
    }
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';
    frame.style.transform = rot ? `translate(${h * s}px, 0) rotate(90deg) scale(${s})` : `scale(${s})`;
    $('pv-clip').style.width = vw * s + 'px';
    $('pv-clip').style.height = vh * s + 'px';
  };
  const setMode = (m) => {
    mode = m;
    try { localStorage.setItem('took.portraitPreview', m); } catch { /* 저장 불가 환경 */ }
    document.querySelectorAll('.pv-mode').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    fit();
  };
  document.querySelectorAll('.pv-mode').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('pv-fold').addEventListener('click', () => {
    const folded = $('pv-bar').classList.toggle('folded');
    $('pv-fold').textContent = folded ? '설정' : '설정 닫기';
    $('pv-fold').setAttribute('aria-expanded', String(!folded));
  });
  $('pv-page').addEventListener('change', () => { frame.src = $('pv-page').value; });
  // ---------- 스마트폰 프레임 ----------
  $('pv-show-phone').checked = showPhone;
  $('pv-show-phone').addEventListener('change', (e) => {
    showPhone = e.target.checked;
    try { localStorage.setItem('took.previewPhone', showPhone ? 'on' : 'off'); } catch { /* 저장 불가 환경 */ }
    fit();
  });
  // 태블릿 팔레트가 QR 을 띄우면(palette.js 가 알림) 'QR 찍기'를 켠다
  let lastQr = null;
  addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.data?.type !== 'took:qr' || typeof e.data.url !== 'string') return;
    lastQr = e.data.url;
    $('pv-scan').disabled = false;
    $('pv-scan').classList.add('ready');
  });
  // 'QR 찍기': 휴대폰 카메라로 찍은 것처럼 QR 주소를 폰 화면에서 연다. QR 주소가 같은 와이파이 PC 주소(192.168…)여도
  // 미리보기에서는 지금 주소로 연다 (같은 화면). 열 때마다 손님 휴대폰 저장값(tookPhone.*)을 비워 새 손님처럼
  const clearPhone = () => {
    try { for (const st of [sessionStorage, localStorage]) Object.keys(st).filter((k) => k.startsWith('tookPhone.')).forEach((k) => st.removeItem(k)); } catch { /* 없음 */ }
  };
  $('pv-scan').addEventListener('click', () => {
    if (!lastQr) return;
    const u = new URL(lastQr);
    clearPhone();
    pframe.src = u.pathname.replace(/^\//, '') + u.search + u.hash;
    $('pv-empty').hidden = true;
    $('pv-scan').classList.remove('ready');
  });
  // 이 기기를 태블릿으로: 미리보기 틀을 벗고 지금 태블릿 화면을 그대로 연다 (다음부터 틀 없이)
  // 이 기기를 휴대폰으로: 손님 휴대폰 화면(지금 폰 프레임의 화면, 없으면 챗봇)으로. 해제는 주소 뒤 ?device=auto
  const pick = (mode) => {
    const label = mode === 'tablet' ? '매장 태블릿(키오스크)' : '손님 휴대폰';
    if (!confirm(`이 기기를 ${label} 모드로 고정할까요?\n다음부터 이 기기에서는 이 모드로만 열려요.\n해제하려면 주소 뒤에 ?device=auto 를 붙여 여세요.`)) return;
    try { localStorage.setItem('took.deviceMode', mode); } catch { /* 저장 불가 환경: 이번만 */ }
    let next = mode === 'tablet' ? 'palette.html' : 'chat.html';
    try {
      const w = (mode === 'tablet' ? frame : pframe).contentWindow;
      if (w.location.href !== 'about:blank' && w.location.origin === location.origin) next = w.location.pathname.replace(/^\//, '') + w.location.search;
    } catch { /* 다른 주소 */ }
    location.replace(next);
  };
  $('pv-pick-tablet').addEventListener('click', () => pick('tablet'));
  $('pv-device-reset').addEventListener('click', () => {
    if (!confirm('이 기기의 태블릿 고정을 풀고 처음 상태(태블릿+스마트폰 미리보기)로 돌아갈까요?')) return;
    try { localStorage.removeItem('took.deviceMode'); } catch { /* 저장 불가 환경 */ }
    location.replace('portrait.html');
  });
  $('pv-pick-phone').addEventListener('click', () => pick('phone'));
  $('pv-preset').addEventListener('click', () => {
    clearPhone();
    pframe.src = 'about:blank';
    $('pv-empty').hidden = false;
  });
  document.addEventListener('fullscreenchange', fit); // F11 등으로 전체 화면이 바뀌면 다시 맞춘다
  addEventListener('resize', fit);
  // 상단 '세로로 보기' 버튼으로 오면 그 화면부터 (?page=palette.html). 안에서 메뉴로 다른 화면에 가면 고르기 칸도 따라 바뀐다
  // 목록에 없는 화면(제품 상세 등)도 이 사이트 안의 .html 이면 그대로 연다
  const start = params.get('page');
  const startOk = start && /^[\w-]+\.html(\?[^#]*)?$/.test(start);
  if (startOk && [...$('pv-page').options].some((o) => o.value === start)) $('pv-page').value = start;
  frame.addEventListener('load', () => {
    try {
      const now = frame.contentWindow.location.pathname.split('/').pop() || 'index.html';
      if ([...$('pv-page').options].some((o) => o.value === now)) $('pv-page').value = now;
    } catch { /* 다른 주소 */ }
  });
  setMode(mode);
  // 미리보기를 새로고침하면(F5·새로고침 버튼) 태블릿은 상태를 비우고 시작 화면(홈)부터, 폰은 빈 화면으로
  if (reloaded) {
    try { Object.keys(sessionStorage).filter((k) => k.startsWith('took.') || k.startsWith('tookPhone.')).forEach((k) => sessionStorage.removeItem(k)); Object.keys(localStorage).filter((k) => k.startsWith('tookPhone.')).forEach((k) => localStorage.removeItem(k)); } catch { /* 없음 */ }
    $('pv-page').value = 'index.html';
  }
  frame.src = reloaded ? 'index.html' : startOk ? start : $('pv-page').value;
</script>
</body>
</html>
