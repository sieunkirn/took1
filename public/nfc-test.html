<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>took(툭) - NFC 테스트</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="manifest" href="manifest.webmanifest">
<script src="js/touch-calib.js"></script>
<script src="js/fullscreen-keep.js"></script><!-- 전체화면 고정: 빠져도 다음 터치에서 다시 -->
<script src="js/theme-boot.js"></script>
<style>
  /* NFC 테스트 (2026-11-18): 직원용 시험 화면. 관리자 화면의 'NFC 테스트'로 온다.
     NFC 리더기(ACR1555U, 블루투스 키보드 모드)에 태그를 대면 몇 번 카드인지, 읽은 번호, 찾은 제품을 크게 보여 준다.
     읽기는 손님 화면과 같은 js/nfc.js(listenNfc·matchTag·findTagProduct) 를 쓴다.
     무채색 화면. 예외: 찾은 제품의 색 동그라미는 실제 색 (바코드 테스트 화면과 같음) */
  html, body { background: var(--bg); }
  .nt { max-width: 900px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 17px; }
  .nt-head { display: flex; gap: 14px; align-items: center; }
  .nt-head h1, .nt-head p { margin: 0; }
  .nt-head button { flex: none; min-height: 52px; border-radius: var(--r-s); }
  .nt-box { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
  .nt-box > .label { font-size: 13px; }
  /* 마지막 결과: 카드 이름을 아주 크게, 읽으면 테두리가 잠깐 굵어진다 */
  .nt-main { min-height: 360px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; transition: border-width 0.15s; }
  .nt-main.hit { border: 6px solid var(--ink); }
  .nt-card { font-size: 88px; font-weight: 900; line-height: 1.1; }
  .nt-wait { font-size: 30px; font-weight: 700; color: var(--mute); }
  .nt-num { font: 700 30px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 0.04em; word-break: break-all; }
  .nt-meta { color: var(--mute); font-size: 16px; }
  .nt-prod { display: flex; gap: 16px; align-items: center; text-align: left; margin-top: 8px; }
  .nt-dot { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-2); flex: none; }
  .nt-prod strong { display: block; font-size: 20px; }
  .nt-log table { font-size: 15px; }
  .nt-log td.mono { font-family: ui-monospace, Consolas, monospace; }
  .nt-log .empty td { color: var(--mute); }
  .nt-cards li { margin: 4px 0; }
  .nt-cards code { font-size: 15px; }
</style>
</head>
<body data-idle-reset="off">
<main class="nt">
  <header class="nt-head">
    <button type="button" id="nt-back">← 관리자</button>
    <div>
      <h1>NFC 테스트</h1>
      <p class="muted small">시험 화면 (손님 화면 아님) · 리더기에 태그를 대면 몇 번 카드인지 보여 줘요</p>
    </div>
  </header>

  <section class="nt-box nt-main" id="nt-result" aria-live="polite">
    <p class="nt-wait">카드를 리더기에 대 보세요</p>
    <p class="nt-meta">리더기가 블루투스로 연결돼 있고, 메모장에 번호가 찍히는 상태여야 해요</p>
  </section>

  <section class="nt-box nt-log">
    <div class="label">읽은 기록 <span id="nt-count"></span></div>
    <table>
      <thead><tr><th>시각</th><th>카드</th><th>읽은 번호</th><th>제품</th></tr></thead>
      <tbody id="nt-rows"><tr class="empty"><td colspan="4">아직 없어요</td></tr></tbody>
    </table>
    <div class="row" style="margin-top:10px"><button type="button" id="nt-clear">기록 지우기</button></div>
  </section>

  <section class="nt-box">
    <div class="label">등록된 카드</div>
    <ul class="nt-cards" id="nt-cards"></ul>
    <p class="small muted">'글자 빠짐 감안'으로 나오면 표의 번호가 불완전한 거예요. 그때 읽은 14글자 번호를 Claude 에게 알려 주면 정확한 번호로 바꿔요.</p>
  </section>
</main>
<script type="module" src="js/nfc-test.js"></script>
</body>
</html>
