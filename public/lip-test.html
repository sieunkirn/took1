<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>took(툭) - 립 컬러 매핑(테스트)</title>
<link rel="stylesheet" href="css/wireframe.css">
</head>
<body>
<main class="fit lip-layout">
  <section class="area lip-cam">
    <div class="label">[1. 카메라 영상 영역]</div>
    <div class="stage" id="source-stage">
      <div class="placeholder" id="source-placeholder" style="position:absolute;inset:0">카메라 영상 / 대체 이미지 영역<br>(카메라를 시작하거나 샘플 그림을 선택하세요)</div>
      <video id="video" class="hidden" playsinline muted></video>
      <img id="photo" class="hidden" alt="체험 이미지">
    </div>
    <div class="row">
      <button type="button" id="cam-start">카메라 시작</button>
      <button type="button" id="cam-stop" disabled>카메라 중지</button>
    </div>
    <div class="row">
      <label for="sample-select" class="hidden">샘플 그림</label>
      <select id="sample-select"></select>
      <button type="button" id="sample-start" disabled>샘플 그림으로 체험</button>
    </div>
    <div class="row"><label>사진으로 체험 <input type="file" id="photo-input" accept="image/*"></label></div>
    <div id="cam-status" class="muted">카메라 꺼짐</div>
    <div id="cam-error" class="msg hidden" role="alert"></div>
  </section>

  <section class="area lip-map">
    <div class="label">[2. 입술 매핑 영역]</div>
    <div class="stage"><canvas id="map-canvas" width="640" height="480"></canvas></div>
    <div id="track-status" class="muted">입술 추적 대기 중</div>
    <div class="row"><button type="button" id="extract" disabled>현재 입술색 추출 → 슬라이더에 적용</button></div>
    <div class="row">
      <label for="texture">텍스처</label>
      <select id="texture"></select>
    </div>
    <div class="slider"><label for="intensity">농도</label><input type="range" id="intensity" min="0" max="100" step="1"><output id="intensity-out"></output></div>
  </section>

  <div class="lip-side">
    <section class="area">
      <div class="label">[3. 색상 조절 영역]</div>
      <div class="swatches" id="swatches" role="group" aria-label="립 컬러 프리셋"></div>
      <div class="slider"><label for="hue">색상(H)</label><input type="range" id="hue" min="0" max="360" step="1"><output id="hue-out"></output></div>
      <div class="slider"><label for="sat">채도(S)</label><input type="range" id="sat" min="0" max="100" step="1"><output id="sat-out"></output></div>
      <div class="slider"><label for="lig">명도(L)</label><input type="range" id="lig" min="0" max="100" step="1"><output id="lig-out"></output></div>
      <div class="row"><button type="button" id="reset">초기화</button></div>
    </section>

    <section class="area">
      <div class="label">[4. 현재 선택한 색상 정보]</div>
      <table id="color-info" class="compact"><tbody>
        <tr><th>HEX</th><td id="ci-hex"></td></tr>
        <tr><th>RGB</th><td id="ci-rgb"></td></tr>
        <tr><th>HSL</th><td id="ci-hsl"></td></tr>
        <tr><th>Lab</th><td id="ci-lab"></td></tr>
        <tr><th>출처</th><td id="ci-source"></td></tr>
      </tbody></table>
    </section>

    <section class="area">
      <div class="label">[5. 제품 추천 / 6. 이동]</div>
      <div class="row">
        <button type="button" id="recommend">이 색상으로 제품 추천 받기</button>
        <button type="button" id="home">홈으로 돌아가기</button>
      </div>
    </section>
  </div>
</main>
<script type="module" src="js/lip-test.js"></script>
</body>
</html>
