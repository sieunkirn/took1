  <div class="fc-dose" id="fc-dose" aria-hidden="true"></div>
  <div class="fc-handle" id="fc-handle" aria-hidden="true"><svg class="fc-handle-edge"><path/></svg></div>
  <!-- 질감 동그라미 (2026-11-17 사용자 요청 "동그라미 4개가 질감 동그라미"): 지금 색을 matte · glossy · satin · sheer · shimmer 질감으로 그린 동그라미 줄.
       옆으로 밀면 넘어가고 가운데 큰 동그라미가 고른 질감 (원본 4번처럼 오른쪽으로 갈수록 작고 흐리게). 옆 동그라미를 누르면 그게 가운데로 -->
  <div class="fc-swatches" id="fc-swatches" role="group" tabindex="0" aria-label="질감 (옆으로 밀어 바꾸기)" data-i18n-aria="fc.textures"></div>
  <!-- 텍스처 이름: 누를 때마다 matte → glossy → satin → sheer → shimmer (가운데 질감 동그라미도 같이 넘어간다) -->
  <button type="button" class="fc-tex" id="fc-tex"><span id="fc-tex-name">matte</span></button>

  <!-- 하단 시트: 가운데 로고 버튼을 누르면 바로 올라와 지금 색과 비슷한 추천 제품 (색이 바뀌면 목록도 바로 바뀐다).
       2026-11-16 사용자 요청으로 시트 안 농도 슬라이더·'이 컬러로 제품 찾기' 버튼은 뺐다 -->
  <section class="fc-sheet" id="fc-sheet" aria-label="추천 제품" data-i18n-aria="pal.result">
    <div class="fc-results" id="fc-results">
      <div class="fc-rec-dots" id="fc-rec-dots" role="group" aria-label="추천 제품 색" data-i18n-aria="pal.result"></div>
      <p id="rec-status" class="fc-rec-status" aria-live="polite"></p>
      <div id="rec-list" class="fc-rec-list"></div>
    </div>
  </section>
  <button type="button" class="fc-sbtn" id="fc-sbtn" aria-expanded="false" data-i18n-aria="fc.sheet" aria-label="제품 찾기 열기"></button>
  <!-- 왼쪽 세로 메뉴(스캔·NFC·9점·집 알약)는 2026-11-26 사용자 요청으로 뺐다. 처음으로 = 위 로고, 추천 = 가운데 로고 버튼, NFC = 리더기에 대면 바로 -->
  <p id="nfc-hint" class="fc-toast" aria-live="polite"></p>

  <!-- lip.js 가 쓰는 텍스처 버튼 묶음 (화면에는 위 matte 알약 하나로 보인다)과 입술 색 진하기(저장된 값 그대로, 화면에는 없음) -->
  <div hidden><div id="textures"></div><input type="range" id="intensity" min="0" max="100" step="1"><output id="intensity-out"></output></div>
</main>
<script type="module" src="js/lip.js"></script>
<script type="module" src="js/palette.js"></script>
</body>
</html>
