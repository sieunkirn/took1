<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title data-i18n="pal.pageTitle">took(툭) - 팔레트</title>
<link rel="stylesheet" href="css/wireframe.css">
<script>
  // 첫 화면이 그려지기 전에: 다크 모드를 바로 켜고(밝게 깜빡이지 않게), 시작 화면에서 넘어왔으면 들어오는 움직임(.enter-fx)을 켠다
  (function () {
    var r = document.documentElement;
    try {
      if (localStorage.getItem('took.theme') === 'dark') r.dataset.theme = 'dark';
      if (sessionStorage.getItem('took.enterFx')) {
        sessionStorage.removeItem('took.enterFx');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          r.classList.add('enter-fx');
          setTimeout(function () { r.classList.remove('enter-fx'); }, 1500);
        }
      }
    } catch (e) { /* 저장 불가 환경 */ }
  })();
</script>
</head>
<!-- 팔레트: 왼쪽은 립 매핑 카메라와 어울리는 컬러 측정(lip.js), 오른쪽 위는 조제한 색·텍스처·추천, 오른쪽 아래는 팔레트(palette.js).
     물감을 섞을 때마다 palette.js 가 took:apply 이벤트로 섞은 색을 보내 카메라 입술에 바로 입힌다 -->
<body data-layout="palette" class="palette-page">
<main class="fit palette">
  <!-- 왼쪽: 립 매핑 카메라 -->
  <section class="area lip-user-view pal-cam">
    <div class="label" data-i18n="pal.camArea">가상 립 메이크업 화면</div>
    <div class="stage">
      <div class="placeholder loading" id="placeholder" style="position:absolute;inset:0"><div class="spinner" aria-hidden="true"></div><p id="placeholder-text" data-i18n="lip.camPreparing">카메라를 준비하고 있습니다<br>권한 요청이 뜨면 허용해 주세요</p></div>
      <canvas id="view" class="hidden"></canvas>
      <video id="video" class="hidden" playsinline muted></video>
    </div>
    <p id="color-name" class="small"></p>
    <p id="guide" class="muted" aria-live="polite"></p>
    <p id="nfc-hint" class="nfc-hint pal-nfc" aria-live="polite"></p>
    <!-- 휴대폰 NFC (테스트 단계): 휴대폰에서 열면 '휴대폰 NFC 켜기', 컴퓨터·iPad 에서 열면 '휴대폰으로 NFC 읽기'(QR 연결) -->
    <div class="row pal-nfc-row hidden" id="pal-nfc-row">
      <button type="button" id="pal-nfc-start" class="hidden" data-i18n="pal.nfcStart">휴대폰 NFC 켜기</button>
      <button type="button" id="pal-nfc-pair" class="hidden" data-i18n="pal.nfcPair">휴대폰으로 NFC 읽기</button>
      <span id="pal-nfc-state" class="small muted" aria-live="polite"></span>
    </div>
    <div id="error" class="msg hidden" role="alert"></div>
    <div class="row">
      <button type="button" id="cam-retry" class="hidden" data-i18n="pal.camRetry">카메라 다시 연결</button>
    </div>
  </section>

  <!-- 오른쪽: 위에서 아래로 쓰는 순서대로 ① 내 톤 찾기 → ② 팔레트(물감·섞는 칸) → ③ 텍스처·농도·제품 추천.
       조제한 색은 섞는 칸에 그대로 보이므로 따로 보여 주지 않는다. 추천을 받으면 ①~③ 대신 ④ 추천 결과가 나온다 -->
  <div class="pal-right">
    <!-- ① 나에게 어울리는 컬러 (립 컬러 매핑에서 옮겨 옴): 추천 컬러를 누르면 팔레트에 한 방울 떨어진다 -->
    <section class="area pal-match" aria-label="나에게 어울리는 컬러" data-i18n-aria="pal.match">
      <div class="label" data-i18n="pal.match">나에게 어울리는 컬러</div>
      <div class="pal-match-row">
        <button type="button" id="match" disabled data-i18n="pal.matchBtn">내 톤으로 추천받기</button>
        <div class="swatches hidden" id="match-swatches" role="group" aria-label="추천 컬러" data-i18n-aria="pal.matchSwatches"></div>
      </div>
      <p id="match-result" class="small" aria-live="polite"></p>
      <details class="pal-match-more small">
        <summary class="muted" data-i18n="pal.matchMore">측정값 · 안내</summary>
        <p id="match-metrics" class="muted"></p>
        <p class="muted" data-i18n="pal.matchNote">볼·이마 피부색으로 톤을 추정한 참고용 결과입니다. 조명에 따라 달라질 수 있어요.</p>
      </details>
    </section>

    <!-- ② 팔레트: 오른쪽 위 아이콘으로 처음부터 다시 섞는다 -->
    <section class="area pal-board" aria-label="팔레트" data-i18n-aria="pal.board">
      <div class="pal-board-head">
        <h1 class="label" data-i18n="pal.board">팔레트</h1>
        <button type="button" id="reset" class="icon-btn pal-reset" aria-label="처음부터 다시 섞기" title="처음부터 다시 섞기" data-i18n-aria="pal.reset" data-i18n-title="pal.reset">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
      <div id="lip-paints" class="paints lip-paints" role="group" aria-label="립 컬러 물감" data-i18n-aria="pal.paints"></div>
      <div class="pal-mix">
        <div class="mix-wrap" id="mix-wrap">
          <canvas id="mix-canvas" aria-label="섞는 칸 (드래그하면 저어져요)" data-i18n-aria="pal.mixAria" role="img"></canvas>
          <p id="mix-empty" class="mix-empty" data-i18n="pal.mixEmpty">물감을 눌러<br>떨어뜨려요</p>
        </div>
        <div class="pal-tools">
          <p id="mix-hex" class="mix-hex" aria-live="polite"></p>
          <button type="button" id="undo" disabled data-i18n="pal.undo">한 방울 빼기</button>
        </div>
      </div>
    </section>

    <!-- ③ 마무리: 텍스처·농도를 고르고 제품 추천 -->
    <section class="area pal-finish" aria-label="텍스처와 제품 추천" data-i18n-aria="pal.finishArea">
      <div class="row seg" id="textures" role="group" aria-label="텍스처" data-i18n-aria="pal.textures"></div>
      <div class="slider"><label for="intensity" data-i18n="pal.intensity">농도</label><input type="range" id="intensity" min="0" max="100" step="1"><output id="intensity-out"></output></div>
      <button type="button" id="find" class="btn-dark" disabled data-i18n="pal.find">이 색과 비슷한 제품 추천</button>
      <!-- 지금 결과(색·텍스처·농도·내 톤·추천 제품)를 QR 로 손님 휴대폰에 넘겨 챗봇과 이어서 대화 (js/palette.js openTake) -->
      <button type="button" id="take-phone" class="take-phone" disabled data-i18n="pal.take">휴대폰으로 가져가기</button>
    </section>

    <!-- ④ 추천 결과 (추천을 받은 뒤에만) -->
    <section class="area pal-result" aria-label="추천 제품" data-i18n-aria="pal.result">
      <div class="pal-board-head">
        <div class="pal-result-color"><span id="res-swatch" class="color-dot" aria-hidden="true"></span><strong id="res-hex"></strong></div>
        <button type="button" id="back-mix" data-i18n="pal.backMix">← 다시 섞기</button>
      </div>
      <p id="rec-status" class="muted small" aria-live="polite"></p>
      <div id="rec-list" class="pal-rec"></div>
      <button type="button" id="take-phone-res" class="take-phone" data-i18n="pal.take">휴대폰으로 가져가기</button>
    </section>
  </div>

</main>
<dialog id="pal-nfc-dialog" class="pal-nfc-dialog" aria-labelledby="pal-nfc-title">
  <h2 id="pal-nfc-title" data-i18n="pal.nfcPairTitle">휴대폰을 NFC 리더기로</h2>
  <p class="muted small" data-i18n="pal.nfcCodeHelp">휴대폰 Chrome 에서 아래 주소를 열고 네 자리 번호를 입력하세요. QR 을 찍어도 돼요.</p>
  <p id="pal-nfc-url" class="small"></p>
  <p id="pal-nfc-code" class="pal-nfc-code" aria-label="연결 번호"></p>
  <div id="pal-nfc-qr"></div>
  <p id="pal-nfc-pairstate" class="small" aria-live="polite"></p>
  <div class="row">
    <button type="button" id="pal-nfc-close" data-i18n="pal.nfcClose">닫기</button>
    <button type="button" id="pal-nfc-newcode" data-i18n="pal.nfcNewCode">번호 바꾸기</button>
  </div>
</dialog>
<!-- 휴대폰으로 가져가기: QR 을 찍으면 손님 휴대폰의 챗봇(chat.html?from=palette…)이 이 결과로 대화를 시작한다 -->
<dialog id="take-dialog" class="pal-nfc-dialog take-dialog" aria-labelledby="take-title">
  <h2 id="take-title" data-i18n="pal.takeTitle">휴대폰으로 이어서 상담하기</h2>
  <p class="muted small" data-i18n="pal.takeHelp">휴대폰 카메라로 QR 을 찍으면 이 결과로 챗봇과 이어서 대화해요. 사진·영상은 보내지 않아요.</p>
  <div class="take-sum"><span id="take-swatch" class="color-dot" aria-hidden="true"></span><strong id="take-summary"></strong></div>
  <div id="take-qr" class="take-qr" role="img" aria-label="휴대폰 챗봇 연결 QR 코드" data-i18n-aria="pal.takeQrAria"></div>
  <p id="take-url" class="small take-url"></p>
  <div class="row">
    <button type="button" id="take-close" class="btn-dark" data-i18n="pal.takeClose">닫기</button>
  </div>
</dialog>
<script type="module" src="js/lip.js"></script>
<script type="module" src="js/palette.js"></script>
</body>
</html>
