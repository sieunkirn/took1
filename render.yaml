# Render 배포 설정 (Blueprint). Render 대시보드에서 New → Blueprint 로 이 저장소를 고르면 아래대로 만들어진다.
# - 설치: npm ci (postinstall 에서 MediaPipe·ZXing 을 public/vendor 로 복사하고 얼굴 모델을 내려받는다)
# - 실행: npm start (server.js 가 PORT 환경 변수로 열린다. https 는 Render 가 처리)
# - 무료 플랜은 15분 동안 접속이 없으면 잠들고, 다시 접속하면 30초쯤 걸려 깨어난다
#   (휴대폰 QR 연결 정보는 서버 메모리에 있어 잠들었다 깨면 PC 화면이 새 QR 을 자동으로 만든다)
services:
  - type: web
    name: took
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
