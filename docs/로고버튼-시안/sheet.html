<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font-family:"Malgun Gothic",sans-serif;color:#111;width:2400px}
  h1{font-size:44px;margin:0;padding:56px 60px 6px;letter-spacing:-0.02em}
  .sub{font-size:24px;color:#666;padding:0 60px 30px;margin:0}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:36px;padding:0 60px 50px}
  figure{margin:0}
  .crop{width:100%;aspect-ratio:900/640;overflow:hidden;border-radius:20px;background:#000;position:relative}
  .crop img{position:absolute;left:0;width:100%}
  .crop.bottom img{bottom:0}
  .crop.mid img{top:-112%}
  figcaption{padding:16px 4px 0}
  b{display:block;font-size:28px;letter-spacing:-0.01em}
  span{display:block;font-size:21px;line-height:1.45;color:#555;margin-top:6px}
  .tag{display:inline-block;font-style:normal;font-size:18px;font-weight:700;color:#fff;background:#111;border-radius:999px;padding:3px 14px;margin:0 0 8px}
  .tag.rec{background:#FF007B}
</style>
<h1>가운데 로고 버튼 시안</h1>
<p class="sub">실제 거울 화면 아랫부분에 시안만 얹은 그림 · 카메라 자리는 회색으로 대신함</p>
<div class="row">
  <figure><div class="crop bottom"><img src="0-now-closed.png"></div><figcaption><i class="tag">지금</i><b>로고만 있는 동그라미</b><span>무엇을 하는 버튼인지 글자가 없음</span></figcaption></figure>
  <figure><div class="crop bottom"><img src="A-pill.png"></div><figcaption><i class="tag rec">A · 추천</i><b>글자가 들어간 알약 버튼</b><span>로고 + "추천 제품 보기". 가장 바로 읽힘</span></figcaption></figure>
  <figure><div class="crop bottom"><img src="B-label.png"></div><figcaption><i class="tag">B</i><b>동그라미 + 아래 글자</b><span>모양은 그대로, 동그라미만 조금 작아짐</span></figcaption></figure>
  <figure><div class="crop bottom"><img src="C-bubble.png"></div><figcaption><i class="tag">C</i><b>처음 한 번 뜨는 말풍선</b><span>한 번 누르면 사라짐. 평소 화면은 지금과 같음</span></figcaption></figure>
</div>
<div class="row">
  <figure><div class="crop bottom"><img src="D-peek.png"></div><figcaption><i class="tag">D</i><b>시트 머리가 살짝 보임</b><span>아래에서 올라오는 서랍처럼 보임. 다이얼 아래가 조금 가려짐</span></figcaption></figure>
  <figure><div class="crop mid"><img src="0-now-open.png"></div><figcaption><i class="tag">지금 · 열렸을 때</i><b>열려도 같은 로고</b><span>다시 누르면 닫힌다는 표시가 없음</span></figcaption></figure>
  <figure><div class="crop mid"><img src="E-open-close.png"></div><figcaption><i class="tag rec">E · 추천</i><b>열렸을 때는 내림 화살표</b><span>A~D 어느 것과도 같이 쓸 수 있음</span></figcaption></figure>
</div>
